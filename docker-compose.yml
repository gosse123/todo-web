services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://todo_user:todo_pass@db:5432/todo_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data: